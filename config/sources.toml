# Every external input resource: where it lives (relative to the data root) and what it is.
# `cichlid-data provenance write` turns each entry into a source.json beside the data, with an
# inventory of its files. Species downloads are described by their own download.json (Stage 1).
# Fields marked "to confirm" should be checked against the provider's site and filled in.

[[source]]
path = "Inputs/Families/TreeFam9"
name = "TreeFam 9 (HMM library, alignments and trees)"
type = "treefam"
version = "9"
url = "https://ftp.ebi.ac.uk/pub/archive/treefam/"
retrieved = "2017 (year only; the exact date and the exact location were not recorded)"
licence = "to confirm: TreeFam is described as freely available, but no licence text for the data has been found (the FTP archive README has none); questions go to the EMBL-EBI support form with TreeFam in the subject"
citation = "Schreiber F, Patricio M, Muffato M, Pignatelli M, Bateman A (2014) TreeFam v9: a new website, more species and orthology-on-the-fly. Nucleic Acids Res 42:D922-5. doi:10.1093/nar/gkt1055"
notes = "Placed by hand in 2017, not fetched by any script; where it was fetched from was not recorded. TreeFam 9 was released in March 2013 with 109 species and 15,736 families. The TreeFam website (treefam.org) was retired on 30 September 2026 (Ensembl blog, 25 September 2026), and the url above is the TreeFam FTP archive that the notice names for its databases and data files; the archive README lists, in its download/ directory, treefam_family_data.tar.gz (alignment, tree and orthologs for each family), treefam9.hmm3.tar.gz and treefam9.hmm2.tar.gz (the HMMs), treefam_species_tree9.phy, species_list.txt and an md5sum.txt, and in databases/ six release databases. Which of these this copy's hmm/, trees/ and protein_to_species.txt came from (protein_to_species.txt is not in the list) has not yet been established by comparing them. A TreeFam developer's reply on the former support forum (undated) says the public family-data package held alignments for 15,321 of the 15,736 families, whereas this copy has 15,736 alignments, so the public file may not reproduce it. The copy in the cloud is the one to keep."

[[source]]
path = "Inputs/Families/Compara116"
name = "Ensembl Compara release 116 gene trees (dumps, and the trees pruned to our panel)"
type = "ensembl"
version = "116"
url = "https://ftp.ensembl.org/pub/release-116/emf/ensembl-compara/homologies/"
licence = "Ensembl data are available without restriction (ensembl.org/info/about/legal/disclaimer.html); the disclaimer notes that some data may be subject to third-party constraints"
citation = "Cite the Ensembl paper for release 116 (ensembl.org/info/about/publications.html)"
notes = "dumps/ holds two files fetched with wget -c from the URL above: Compara.116.protein_default.nhx.emf.gz (every default protein gene tree, NHX) and Compara.116.protein_default.aa.fasta.gz (the protein alignments, one block per tree, each ending //). This is from the pipeline's README, relayed by the TreeFam project; the file sizes have not yet been compared with the FTP server. The cloud copy of dumps/ is the old sync's backup, kept so a release that leaves Ensembl's FTP can be rebuilt. prepared/ is derived: Compara trees pruned to config/compara_panel.tsv (the default protein trees only, not Compara's other tree sets)."

