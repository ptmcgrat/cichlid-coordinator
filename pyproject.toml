[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cichlid-coordinator"
version = "0.12.0"
description = "File locations, cloud transfers and inputs for the cichlid protein phylogeny project"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
expression = ["numpy", "scipy"]
samples = ["gspread"]

[project.scripts]
cichlid-data = "cichlid_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cichlid_data.downloaders" = ["*.R"]          # export_seurat.R
